<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="/assets/css/global.css">

    <title>48-Hour Loan Proposal™</title>
</head>

<body>

    <!-- NAV BAR (top of page, no logo above it) -->
    <div id="nav-placeholder"></div>
    <script>
        fetch("/components/Nav.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("nav-placeholder").innerHTML = html;
            });
    </script>

    <!-- HERO (single logo + single title) -->
    <div id="hero-placeholder"></div>
    <script>
        fetch("/components/Hero.html")
            .then(r => r.text())
            .then(html => {
                html = html.replace("[[PAGE_TITLE]]", "48-Hour Loan Proposal™");
                html = html.replace("[[PAGE_SUBTITLE]]", "Your lender-ready business plan and financial model — delivered in 48 hours.");
                document.getElementById("hero-placeholder").innerHTML = html;
            });
    </script>

    <!-- MAIN CONTENT -->
    <div class="content">
        <h2>Get in Touch</h2>
        <p>If you have questions, want to start your 48‑Hour Loan Proposal™, or need guidance before speaking with your lender, reach out anytime.</p>

        <div class="contact-info">
            <p><b>Email:</b> <a href="mailto:alex@48hourloanproposal.site">alex@48hourloanproposal.site</a></p>
            <p><b>Phone:</b> (502) 654‑9500</p>
            <p>We respond quickly — usually within the hour.</p>
        </div>
    </div>

      <!-- FOOTER -->
<div id="footer-placeholder"></div>
<script>
    fetch("/components/Footer.html")
        .then(response => response.text())
        .then(html => {
            document.getElementById("footer-placeholder").innerHTML = html;
        });
</script>

</body>
</html>
