<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>48-Hour Loan Proposal</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* NAV BAR */
        nav {
            background-color: #001f3f; /* Midnight Blue */
            padding: 15px 30px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;              /* Horizontal layout */
            gap: 30px;                  /* Space between items */
            align-items: center;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(to bottom, #001f3f, #003366);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-logo {
            width: 120px;
            height: 120px;
            background-color: white;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-logo img {
            width: 70px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <!-- NAV BAR -->
    <nav>
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/about.html">About</a></li>
            <li><a href="/contact.html">Contact</a></li>
            <li><a href="/prototype.html">Web Portal</a></li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <div class="hero-logo">
            <img src="/images/logo.png" alt="Logo">
        </div>

        <h1>48-Hour Loan Proposal</h1>
        <p>Your fast, lender-ready business plan and financial model — delivered in 48 hours.</p>
    </section>

</body>
</html>
