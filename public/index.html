<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Global Stylesheet -->
    <link rel="stylesheet" href="/assets/css/global.css">

    <title>48-Hour Loan Proposal™ — Corrected Page</title>
</head>

<body>

    <!-- HEADER COMPONENT -->
    <div id="header-placeholder"></div>
    <script>
        fetch("/components/Header.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("header-placeholder").innerHTML = html;
            });
    </script>

    <!-- HERO COMPONENT (Single Logo + Single Title) -->
    <div id="hero-placeholder"></div>
    <script>
        fetch("/components/Hero.html")
            .then(r => r.text())
            .then(html => {
                html = html.replace("[[PAGE_TITLE]]", "Your Correct Page Title");
                html = html.replace("[[PAGE_SUBTITLE]]", "Your clean subtitle goes here.");
                document.getElementById("hero-placeholder").innerHTML = html;
            });
    </script>

    <!-- NAV COMPONENT (No logo above it) -->
    <div id="nav-placeholder"></div>
    <script>
        fetch("/components/Nav.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("nav-placeholder").innerHTML = html;
            });
    </script>

    <!-- MAIN CONTENT -->
    <div class="content">
        <h2>Page Content</h2>
        <p>This is where your page content goes. The top of the page is now clean, organized, and visually correct.</p>
    </div>

    <!-- FOOTER COMPONENT -->
    <div id="footer-placeholder"></div>
    <script>
        fetch("/components/Footer.html")
            .then(r => r.text())
            .then(html => {
                document.getElementById("footer-placeholder").innerHTML = html;
            });
    </script>

</body>
</html>
